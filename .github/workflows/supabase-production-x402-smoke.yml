name: Supabase production x402 smoke

on:
  push:
    branches:
      - main
    paths:
      - 'production-topology.json'
      - 'deploy/supabase-x402-data-tools/**'
      - 'scripts/verify-production-topology.js'
      - 'scripts/verify-supabase-production.js'
      - '.github/workflows/supabase-production-x402-smoke.yml'
  pull_request:
    paths:
      - 'production-topology.json'
      - 'deploy/supabase-x402-data-tools/**'
      - 'scripts/verify-production-topology.js'
      - 'scripts/verify-supabase-production.js'
      - '.github/workflows/supabase-production-x402-smoke.yml'
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-x402-smoke
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify canonical production topology
        run: node scripts/verify-production-topology.js
      - name: Verify Supabase production seller
        run: node scripts/verify-supabase-production.js
