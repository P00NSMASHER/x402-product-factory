name: Register Supabase seller with Agent402

on:
  push:
    paths:
      - '.github/workflows/register-agent402-supabase.yml'

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Register seller
        shell: bash
        run: |
          set -euo pipefail
          origin='https://bvjtimsalbzkmulyinpg.supabase.co/functions/v1/x402-data-tools'
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST 'https://agent402.tools/api/index/register'             -H 'content-type: application/json'             --data "$(jq -nc --arg origin "$origin" '{origin:$origin}')")
          echo "HTTP $code"
          cat "$tmp" | jq . || cat "$tmp"
          test "$code" -ge 200 -a "$code" -lt 300
