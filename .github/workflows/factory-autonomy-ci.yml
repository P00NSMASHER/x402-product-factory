name: Autonomous App Candidate Factory
on:
  pull_request:
    paths:
      - 'packages/application-factory/autonomy/**'
      - 'packages/application-factory/manufacturing/**'
      - 'packages/application-factory/recipes.json'
      - 'scripts/run-autonomous-factory.js'
      - 'scripts/validate-autonomy-ideas.js'
      - 'scripts/restore-autonomous-checkpoint.js'
      - 'scripts/export-autonomous-fleet.js'
      - '.github/workflows/factory-autonomy-ci.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: autonomous-factory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate safe candidate selection and unattended manufacturing
        run: node --test packages/application-factory/autonomy/*.test.js
      - name: Restore prior successful same-branch checkpoint if available
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          previous="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow factory-autonomy-ci.yml --branch "$TARGET_BRANCH" --limit 20 --json databaseId,conclusion --jq '[.[] | select(.conclusion=="success")][0].databaseId // empty')"
          if [ -n "$previous" ]; then
            source="$RUNNER_TEMP/previous-autonomy"
            mkdir -p "$source"
            gh run download "$previous" --repo "$GITHUB_REPOSITORY" --name "autonomous-apps-$previous" --dir "$source"
            find "$source" -type d -exec chmod 700 {} +
            find "$source" -type f -exec chmod 600 {} +
            node scripts/restore-autonomous-checkpoint.js --source "$source" --output "$RUNNER_TEMP/autonomous-apps" --max-cycles 32
          else
            echo "No earlier successful same-branch artifact. Starting from clean private state."
          fi
      - name: Manufacture one independent synthetic edition per cycle
        run: |
          set -euo pipefail
          at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/run-autonomous-factory.js --output "$RUNNER_TEMP/autonomous-apps" --at "$at" > "$RUNNER_TEMP/current-autonomous-cycle.json"
          node -e 'const fs=require("fs"),path=require("path"),crypto=require("crypto");const at=process.argv[1],root=path.join(process.env.RUNNER_TEMP,"autonomous-apps","autonomy"),r=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,"current-autonomous-cycle.json"),"utf8"));const expectedCycle=Math.floor((Date.parse(at)-Date.parse("2026-10-13T00:00:00Z"))/21600000);if(r.cycle!==expectedCycle)throw Error("WRONG_CYCLE");const receipt=JSON.parse(fs.readFileSync(path.join(root,"cycle-"+r.cycle+".json"),"utf8"));const hash=crypto.createHash("sha256").update(JSON.stringify({...receipt,digest:undefined})).digest("hex");if(receipt.digest!==hash||receipt.cycle!==r.cycle||receipt.accepted!==r.accepted||receipt.failed!==r.failed||receipt.verification!==r.verification)throw Error("CYCLE_RECEIPT_INVALID");if(!r.exhausted&&(r.planned!==1||r.failed!==0||r.accepted!==1||r.verification!=="executed-packaged-workflow"))throw Error("AUTONOMY_ACCEPTANCE_FAILED");if(r.releaseApproved!==false||r.marketValidated!==false||r.paymentsSent!==0||r.transmittedMessages!==0)throw Error("UNSAFE_RELEASE_STATE");console.log(JSON.stringify({cycle:r.cycle,accepted:r.accepted,reused:r.reused,exhausted:r.exhausted,releaseApproved:false}));' "$at"
      - name: Admit researched app blueprints and independently execute newest candidates
        run: |
          node scripts/validate-autonomy-ideas.js --check
          node scripts/validate-autonomy-ideas.js --build-pending --output "$RUNNER_TEMP/autonomous-apps"
      - name: Export private verified fleet ledger
        run: |
          node scripts/export-autonomous-fleet.js --state-dir "$RUNNER_TEMP/autonomous-apps" --output-dir "$RUNNER_TEMP/autonomous-apps/portfolio" --lookback 24
      - name: Preserve bounded candidate artifacts and source-derived receipts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: autonomous-apps-${{ github.run_id }}
          path: ${{ runner.temp }}/autonomous-apps
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
