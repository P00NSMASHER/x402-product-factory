name: Full-stack application manufacturing
on:
  pull_request:
    paths:
      - 'packages/application-factory/**'
      - 'scripts/**'
      - 'quality/browser/manufactured-applications.cjs'
      - 'quality/browser/sales-command-center.cjs'
      - 'quality/browser/autonomous-fleet.cjs'
      - 'quality/browser/quote-applications.cjs'
      - 'quality/browser/inventory-applications.cjs'
      - 'quality/browser/private-fleet-preview.cjs'
      - '.github/workflows/factory-manufacturing-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factory-manufacturing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  manufacturing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify demand-proof and commercial-claim constraints
        run: node --test packages/application-factory/growth/*.test.js
      - name: Full-stack manufacturing contracts
        run: node --test packages/application-factory/manufacturing/*.test.js
      - name: Run deployment fault-injection and proof-verification tests
        run: node --test packages/application-factory/deploy/*.test.js
      - name: Assemble and independently exercise every default edition
        run: node scripts/manufacture-applications.js --output "$RUNNER_TEMP/manufactured-applications"
      - name: Manufacture three complete quote-to-order applications
        run: node scripts/manufacture-quote-apps.js --output "$RUNNER_TEMP/quote-to-order-apps"
      - name: Manufacture three independent inventory planning applications
        run: node scripts/manufacture-inventory-apps.js --output "$RUNNER_TEMP/inventory-apps"
      - name: Rehearse actual synthetic local deployments across all three SaaS families
        run: |
          node scripts/rehearse-private-deployments.js --document "$RUNNER_TEMP/manufactured-applications" --quote "$RUNNER_TEMP/quote-to-order-apps" --inventory "$RUNNER_TEMP/inventory-apps" --output "$RUNNER_TEMP/deployment-rehearsal"
      - name: Generate fourteen differentiated quote and inventory research SaaS candidates
        run: |
          node scripts/manufacture-cross-family-ideas.js --check
          node scripts/manufacture-cross-family-ideas.js --build --quote-output "$RUNNER_TEMP/research-quote-apps" --inventory-output "$RUNNER_TEMP/research-inventory-apps"
      - name: Probe all seventeen expanded private research and baseline document applications
        run: |
          node scripts/rehearse-private-deployments.js --document "$RUNNER_TEMP/manufactured-applications" --quote "$RUNNER_TEMP/research-quote-apps" --inventory "$RUNNER_TEMP/research-inventory-apps" --output "$RUNNER_TEMP/research-deployment-rehearsal"
      - name: Validate distinct-version synthetic rollback against accepted packages
        run: |
          node scripts/rehearse-versioned-rollout.js --document "$RUNNER_TEMP/manufactured-applications" --quote "$RUNNER_TEMP/quote-to-order-apps" --inventory "$RUNNER_TEMP/inventory-apps" --output "$RUNNER_TEMP/versioned-rollback-rehearsal"
      - name: Run real private localhost portals for all baseline and research applications
        run: |
          set -euo pipefail
          node scripts/run-private-fleet-preview.js --exercise --document "$RUNNER_TEMP/manufactured-applications" --quote "$RUNNER_TEMP/quote-to-order-apps" --inventory "$RUNNER_TEMP/inventory-apps" --state-root "$RUNNER_TEMP/private-baseline-fleet" > "$RUNNER_TEMP/baseline-preview-proof.json"
          node scripts/run-private-fleet-preview.js --exercise --document "$RUNNER_TEMP/manufactured-applications" --quote "$RUNNER_TEMP/research-quote-apps" --inventory "$RUNNER_TEMP/research-inventory-apps" --state-root "$RUNNER_TEMP/private-research-fleet" > "$RUNNER_TEMP/research-preview-proof.json"
          node -e 'const fs=require("fs"),path=require("path");for(const [name,count] of [["baseline",9],["research",17]]){const p=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,name+"-preview-proof.json"),"utf8"));if(p.kind!=="executed-private-fleet-preview"||p.passed!==true||p.apps!==count||p.portalLoopbackOnly!==true||p.sourceDigestsVerified!==true||p.distinctLocalServiceOrigins!==true||p.watchdogRecoveriesVerified!==count||p.watchdogQuarantines!==0||p.externalContacts!==0||p.publicHostingEnabled!==false||p.releaseApproved!==false||p.externalMessagesSent!==0||p.paymentsSent!==0||p.realCustomers!==null||p.collectedRevenue!==null)throw Error("PRIVATE_FLEET_GATE_FAILED");}'
          mkdir -m 700 "$RUNNER_TEMP/private-fleet-evidence"
          cp "$RUNNER_TEMP/baseline-preview-proof.json" "$RUNNER_TEMP/private-fleet-evidence/baseline.json"
          cp "$RUNNER_TEMP/research-preview-proof.json" "$RUNNER_TEMP/private-fleet-evidence/research.json"
          chmod 600 "$RUNNER_TEMP/private-fleet-evidence/"*.json
      - name: Crash entire private host process and resume baseline 9 plus research 17 applications
        run: |
          set -euo pipefail
          node scripts/supervise-private-fleet.js --exercise-crash --document "$RUNNER_TEMP/manufactured-applications" --quote "$RUNNER_TEMP/quote-to-order-apps" --inventory "$RUNNER_TEMP/inventory-apps" --state-root "$RUNNER_TEMP/baseline-crash-session" > "$RUNNER_TEMP/baseline-crash-proof.json"
          node scripts/supervise-private-fleet.js --exercise-crash --document "$RUNNER_TEMP/manufactured-applications" --quote "$RUNNER_TEMP/research-quote-apps" --inventory "$RUNNER_TEMP/research-inventory-apps" --state-root "$RUNNER_TEMP/research-crash-session" > "$RUNNER_TEMP/research-crash-proof.json"
          node -e 'const fs=require("fs"),path=require("path");for(const [name,count] of [["baseline",9],["research",17]]){const p=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,name+"-crash-proof.json"),"utf8"));if(p.kind!=="unattended-private-host-crash-recovery"||p.apps!==count||p.killedLauncher!==true||p.newLauncherBooted!==true||p.sqliteRecordStatePreserved!==true||p.syntheticCredentialHashesPreserved!==true||p.sourcePackageIdentitiesUnchanged!==true||p.tenantApiBoundariesVerified!==true||p.privateLoopbackOnly!==true||p.externalContacts!==0||p.paymentsSent!==0||p.releaseApproved!==false||p.realCustomers!==null||p.collectedRevenue!==null)throw Error("HOST_CRASH_GATE_FAILED");}'
          cp "$RUNNER_TEMP/baseline-crash-proof.json" "$RUNNER_TEMP/private-fleet-evidence/host-crash-baseline.json"
          cp "$RUNNER_TEMP/research-crash-proof.json" "$RUNNER_TEMP/private-fleet-evidence/host-crash-research.json"
          chmod 600 "$RUNNER_TEMP/private-fleet-evidence/"host-crash-*.json
      - name: Install isolated browser-test dependency
        run: npm install --prefix "$RUNNER_TEMP/manufacturing-browser" --no-save --ignore-scripts playwright@1.64.0
      - name: Install Chromium
        run: '"$RUNNER_TEMP/manufacturing-browser/node_modules/.bin/playwright" install --with-deps chromium'
      - name: Native browser acceptance against manufactured packages
        run: |
          NODE_PATH="$RUNNER_TEMP/manufacturing-browser/node_modules" node quality/browser/manufactured-applications.cjs "$RUNNER_TEMP/manufactured-applications"
          NODE_PATH="$RUNNER_TEMP/manufacturing-browser/node_modules" node quality/browser/private-pilots.cjs "$RUNNER_TEMP/manufactured-applications"
      - name: Native private fleet portal on desktop and mobile
        run: |
          FACTORY_PRIVATE_FLEET_SCREENSHOT_DIR="$RUNNER_TEMP/private-fleet-screenshots" NODE_PATH="$RUNNER_TEMP/manufacturing-browser/node_modules" node quality/browser/private-fleet-preview.cjs --document "$RUNNER_TEMP/manufactured-applications" --quote "$RUNNER_TEMP/research-quote-apps" --inventory "$RUNNER_TEMP/research-inventory-apps" --state-root "$RUNNER_TEMP/native-fleet-synthetic"
      - name: Native sales board acceptance (review-only)
        run: NODE_PATH="$RUNNER_TEMP/manufacturing-browser/node_modules" node quality/browser/sales-command-center.cjs
      - name: Native fleet dashboard desktop/mobile acceptance
        run: NODE_PATH="$RUNNER_TEMP/manufacturing-browser/node_modules" node quality/browser/autonomous-fleet.cjs
      - name: Native six inventory replenishment journeys on desktop and mobile
        run: |
          FACTORY_INVENTORY_BROWSER_ARTIFACT_DIR="$RUNNER_TEMP/inventory-browser-screenshots" NODE_PATH="$RUNNER_TEMP/manufacturing-browser/node_modules" node quality/browser/inventory-applications.cjs
      - name: Native six quote-to-order journeys on desktop and mobile
        run: |
          FACTORY_QUOTE_BROWSER_ARTIFACT_DIR="$RUNNER_TEMP/quote-browser-screenshots" NODE_PATH="$RUNNER_TEMP/manufacturing-browser/node_modules" node quality/browser/quote-applications.cjs "$RUNNER_TEMP/quote-to-order-apps"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: private-runnable-fleet-acceptance
          path: ${{ runner.temp }}/private-fleet-evidence
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: private-fleet-phone-desktop-screenshots
          path: ${{ runner.temp }}/private-fleet-screenshots
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: research-deployment-rehearsal
          path: ${{ runner.temp }}/research-deployment-rehearsal
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: researched-quote-applications
          path: ${{ runner.temp }}/research-quote-apps
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: researched-inventory-applications
          path: ${{ runner.temp }}/research-inventory-apps
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: versioned-rollback-rehearsal
          path: ${{ runner.temp }}/versioned-rollback-rehearsal
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: private-deployment-rehearsal
          path: ${{ runner.temp }}/deployment-rehearsal
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: manufactured-applications
          path: ${{ runner.temp }}/manufactured-applications
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: quote-to-order-manufactured-applications
          path: ${{ runner.temp }}/quote-to-order-apps
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: quote-to-order-native-browser-screenshots
          path: ${{ runner.temp }}/quote-browser-screenshots
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: inventory-control-manufactured-applications
          path: ${{ runner.temp }}/inventory-apps
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: inventory-control-native-browser-screenshots
          path: ${{ runner.temp }}/inventory-browser-screenshots
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
