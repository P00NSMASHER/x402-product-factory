name: Factory 018 public source compatibility

on:
  # GitHub runs cron only after this workflow reaches the default branch.
  # While this change is a draft PR the schedule is NOT active.
  schedule:
    - cron: '17 13 * * *'
  pull_request:
    paths:
      - 'quality/benchmarks/018-live-source-probe.js'
      - 'quality/benchmarks/018-live-source-probe.test.js'
      - 'quality/benchmarks/018-source-drift.js'
      - 'quality/benchmarks/018-source-drift.test.js'
      - '.github/workflows/factory-018-live-source-smoke.yml'
      - 'products/pa-vendor-counterparty-review/evidence-contract.js'
      - 'packages/sources/live-pa-identity.js'
      - 'packages/sources/ofac-name-screen.js'
  workflow_dispatch:

permissions:
  contents: read
  actions: read # Read previous redacted workflow artifacts only

concurrency:
  group: factory-018-source-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-only-compatibility:
    name: Public source GET-only compatibility (not release approval)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate source access policy and redacted drift monitor
        run: node --test quality/benchmarks/018-live-source-probe.test.js quality/benchmarks/018-source-drift.test.js

      - name: Load most recent same-branch redacted source snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/factory018-prior"
          prior_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if ! prior_id="$(gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/factory-018-live-source-smoke.yml/runs" \
            -f branch="$prior_branch" -f status=completed -f per_page=30 \
            --jq '.workflow_runs | map(select(.id != (env.GITHUB_RUN_ID | tonumber))) | .[0].id // ""' 2>/dev/null)"; then
            echo "::notice title=Source baseline::Prior artifact could not be queried; begin a new comparison baseline."
            exit 0
          fi
          if [[ "$prior_id" =~ ^[0-9]+$ ]]; then
            if gh run download "$prior_id" -R "$GITHUB_REPOSITORY" \
              -n "factory-018-redacted-source-observation" \
              -D "$RUNNER_TEMP/factory018-prior" >/dev/null 2>&1; then
              echo "::notice title=Source baseline::Retrieved a prior same-branch redacted observation."
            else
              echo "::notice title=Source baseline::Prior run has no usable redacted artifact; bootstrap a new baseline."
            fi
          else
            echo "::notice title=Source baseline::First scheduled or branch-specific redacted observation."
          fi

      - name: Observe fixed public sources and compare drift
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/factory018-current"
          node quality/benchmarks/018-source-drift.js --capture \
            "$RUNNER_TEMP/factory018-prior/current.json" \
            "$RUNNER_TEMP/factory018-current/current.json" \
            "$RUNNER_TEMP/factory018-current/report.json" \
            "$RUNNER_TEMP/factory018-current/summary.md"
          cat "$RUNNER_TEMP/factory018-current/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish only redacted public-source drift evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: factory-018-redacted-source-observation
          path: |
            ${{ runner.temp }}/factory018-current/current.json
            ${{ runner.temp }}/factory018-current/report.json
            ${{ runner.temp }}/factory018-current/summary.md
          retention-days: 35
          if-no-files-found: warn

      - name: Alert when source compatibility or meaningful drift requires review
        run: node quality/benchmarks/018-source-drift.js --enforce "$RUNNER_TEMP/factory018-current/report.json"
