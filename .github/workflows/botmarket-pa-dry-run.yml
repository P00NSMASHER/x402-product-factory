name: BotMarket PA x402 dry-run

on:
  push:
    paths:
      - '.github/workflows/botmarket-pa-dry-run.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PA seller origin with BotMarket
        shell: bash
        run: |
          set -u
          endpoint='https://pa-entity-x402.floot.app'
          payload=$(jq -nc --arg url "$endpoint" --arg price '0.001' '{kind:"service",url:$url,price:$price,dry_run:true}')
          echo "Submitting dry-run validation for: $endpoint"
          tmp=$(mktemp)
          status=$(curl -sS -o "$tmp" -w '%{http_code}' https://botmarket.bot/v1/submit             -H 'Content-Type: application/json'             -d "$payload")
          echo "HTTP $status"
          cat "$tmp" | jq . || cat "$tmp"
          test "$status" -ge 200 -a "$status" -lt 300
