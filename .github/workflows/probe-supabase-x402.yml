name: Probe Supabase x402 seller

on:
  push:
    paths:
      - '.github/workflows/probe-supabase-x402.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe discovery and paid headers
        shell: bash
        run: |
          set -euo pipefail
          base='https://bvjtimsalbzkmulyinpg.supabase.co/functions/v1/x402-data-tools'
          curl -fsS "$base/.well-known/x402" | jq '{x402Version,name,resourceCount:(.resources|length)}'
          h=$(mktemp); b=$(mktemp)
          code=$(curl -sS -D "$h" -o "$b" -w '%{http_code}' "$base/api/sec-filings?ticker=AAPL&limit=1")
          echo "HTTP $code"
          test "$code" = "402"
          grep -Ei '^(payment-required|x402-price|x402-asset|x402-network|x402-pay-to):' "$h"
          pr=$(awk 'BEGIN{IGNORECASE=1} /^PAYMENT-REQUIRED:/{sub(/^[^:]+:[[:space:]]*/,""); gsub(/\r/,""); print; exit}' "$h")
          test -n "$pr"
          python -c 'import sys,base64,json; s=sys.argv[1].replace("-","+").replace("_","/"); s+="="*((4-len(s)%4)%4); d=json.loads(base64.b64decode(s)); a=(d.get("accepts") or [{}])[0]; print(json.dumps({"x402Version":d.get("x402Version"),"resource":d.get("resource"),"accept":a,"extensions":list((d.get("extensions") or {}).keys())},indent=2)); assert d.get("x402Version")==2; assert a.get("network")=="eip155:8453"; assert a.get("amount")=="5000"; assert a.get("asset","").lower()=="0x833589fcd6edb6e08f4c7c32d4f71b54bda02913"; assert a.get("payTo","").lower()=="0x708f7b52b56eafd7fc1de65fc7752ed732914021"; assert a.get("extra",{}).get("name")=="USD Coin"; assert a.get("extra",{}).get("version")=="2"; assert d.get("resource",{}).get("url","").startswith("https://bvjtimsalbzkmulyinpg.supabase.co/functions/v1/x402-data-tools/"); assert "bazaar" in (d.get("extensions") or {})' "$pr"
