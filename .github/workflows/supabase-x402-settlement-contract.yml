name: Supabase x402 settlement contract

on:
  pull_request:
    paths:
      - 'deploy/supabase-x402-data-tools/**'
      - 'packages/x402/**'
      - 'packages/sources/**'
      - 'production-topology.json'
      - 'scripts/run-all-tests.js'
      - 'scripts/run-settlement-contract-tests.js'
      - '.github/workflows/supabase-x402-settlement-contract.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/supabase-x402-data-tools/**'
      - 'packages/x402/**'
      - 'packages/sources/**'
      - 'production-topology.json'
      - 'scripts/run-all-tests.js'
      - 'scripts/run-settlement-contract-tests.js'
      - '.github/workflows/supabase-x402-settlement-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settlement-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned production v6 source parity (offline only)
        run: node deploy/supabase-x402-data-tools/verify-production-baseline.js --check

      - name: Discover and run every settlement test (fail closed)
        run: node scripts/run-settlement-contract-tests.js
