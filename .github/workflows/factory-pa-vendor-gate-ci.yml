# dedicated-repo setup verification
name: Factory product CI

on:
  push:
    branches:
      - main
    paths:
      - 'product-registry.json'
      - 'production-topology.json'
      - 'MIGRATION_MANIFEST.json'
      - 'products/**'
      - 'packages/**'
      - 'deploy/floot-pa-vendor-gate/**'
      - 'scripts/**'
      - 'runtime/**'
      - 'specs/**'
      - 'generated/**'
      - 'quality/**'
      - '.github/workflows/factory-pa-vendor-gate-ci.yml'
  pull_request:
    paths:
      - 'product-registry.json'
      - 'MIGRATION_MANIFEST.json'
      - 'products/**'
      - 'packages/**'
      - 'scripts/**'
      - 'runtime/**'
      - 'specs/**'
      - 'generated/**'
      - 'quality/**'
      - '.github/workflows/factory-pa-vendor-gate-ci.yml'
  workflow_dispatch:

concurrency:
  group: factory-product-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate generated product module registry
        run: node scripts/generate-product-module-registry.js --check

      - name: Validate factory JavaScript syntax
        run: node scripts/validate-js-syntax.js

      - name: Run all discovered factory tests
        run: |
          # Preserve the test runner's failure status; only bound console output.
          if node scripts/run-all-tests.js > /tmp/factory-tests.log 2>&1; then
            grep -E '^=== TEST |testFiles|^.*(tests|pass|fail) [0-9]+$' /tmp/factory-tests.log | tail -n 100 || true
            tail -n 5 /tmp/factory-tests.log
          else
            status=$?
            grep -n -A 12 -B 1 -E '✖|not ok|Error:|error:|AssertionError' /tmp/factory-tests.log | tail -n 300 || true
            tail -n 24 /tmp/factory-tests.log
            exit "$status"
          fi

      - name: Verify application-family manufacturing (offline)
        run: |
          node scripts/build-application-factory.js --check
          node packages/application-factory/acceptance.js --check
          node packages/application-factory/runtime/acceptance.js

      - name: Verify OFAC bounded-cache and settlement safety
        run: node --test packages/sources/ofac-cache-freshness.test.js packages/sources/ofac-cache-settlement.test.js

      - name: Verify Product Quality Lab evidence and hostile input coverage
        run: |
          node quality/product-quality-lab.js --check
          node quality/opportunity-lab.js --check
          node quality/adversarial-contracts.js --check
          node quality/prototypes/018-counterparty-brief.js --check
          node quality/benchmarks/cost-frontier.js --check
          node quality/benchmarks/018-masked-pilot.js --check
          node quality/benchmarks/cost-evidence-gate.js --check
          node quality/benchmarks/018-decision-oracle.js --check
          node --test quality/benchmarks/018-source-contract-v2.test.js quality/benchmarks/018-source-adapter-v2.test.js

      - name: Check Product 018 settlement-safe source gate
        run: node --test products/pa-vendor-counterparty-review/evidence-gate.test.js

      - name: Check composite PA vendor source safety and x402 settlement
        run: node --test quality/benchmarks/composite-016-020-evidence-gate.test.js

      - name: Check remaining 17 products for nonchargeable unavailable sources
        run: node --test quality/benchmarks/remaining-source-evidence-billing.test.js

      - name: Verify SEC and Treasury field-level x402 source validity
        run: node --test quality/benchmarks/sec-treasury-evidence-gate.test.js

      - name: Verify standalone domain fields, UTC dates and nonchargeable corrupt evidence
        run: node --test quality/benchmarks/domain-field-evidence-gate.test.js

      - name: Verify joined 22-product source quality and source-history continuity
        run: node --test quality/integration/source-safety-and-history.test.js

      - name: Verify transplanted source-history code and draft release graph (offline)
        run: |
          node quality/governance/integrated-history.js --check
          node --test quality/governance/release-chain.test.js quality/governance/integrated-history.test.js

      - name: Validate product registry
        run: node scripts/validate-registry.js

      - name: Validate migration manifest
        run: node scripts/validate-migration-manifest.js

      - name: Validate compiled discovery surfaces
        run: node scripts/validate-discovery.js

      - name: Validate Product 002 readiness boundary
        run: node scripts/validate-product-002.js

      - name: Validate Product 002 rollback manifest
        run: node scripts/verify-floot-product-002-rollback.js

      - name: Build deterministic deployment bundle
        run: node scripts/write-deployment-bundle.js https://candidate.example /tmp/x402-factory-bundle

      - name: Build staging release bundle
        run: node scripts/build-release-bundle.js /tmp/x402-factory-bundle https://candidate.example

      - name: Product 018 end-to-end mocked release acceptance
        run: node quality/benchmarks/018-runtime-canary.js --check

      - name: Assert Product 018 source, drift and restored-history policies
        run: node --test quality/benchmarks/018-live-source-probe.test.js quality/benchmarks/018-source-drift.test.js quality/benchmarks/018-baseline-continuity.test.js

      - name: Run every staging product release gate
        run: node scripts/run-release-gates.js

      - name: Run structural deploy-candidate preflight
        env:
          SEC_USER_AGENT: x402-product-factory-ci/1.0 ci@example.com
          PUBLIC_API_BASE: https://candidate.example
        run: node runtime/validate-deploy-candidate.js
