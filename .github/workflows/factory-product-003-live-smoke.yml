name: Factory product live smokes

on:
  push:
    branches:
      - main
    paths:
      - 'product-registry.json'
      - 'products/**'
      - 'packages/sources/**'
      - 'scripts/run-live-smokes.js'
      - 'scripts/verify-floot-product-002.js'
      - '.github/workflows/factory-product-003-live-smoke.yml'
  workflow_dispatch:

concurrency:
  group: factory-live-smokes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit Product 002 Floot cutover readiness without payment
        run: node scripts/verify-floot-product-002.js
      - name: Run Product 002 zero-spend live-source smoke
        run: node products/pa-vendor-gate/live-smoke.js
      - name: Run every staging product live smoke
        run: node scripts/run-live-smokes.js

