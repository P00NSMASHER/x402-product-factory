name: BotMarket x402 portfolio dry-run

on:
  push:
    paths:
      - '.github/workflows/botmarket-five-dry-run.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate five x402 product landing pages with BotMarket
        shell: bash
        run: |
          set -u
          services=(
            'SEC Recent Filings|https://sec-recent-filings-x402-f9qatj.v2.appdeploy.ai/'
            'OFAC SDN Name Screen|https://ofac-sdn-name-screen-x402-m9ko96.v2.appdeploy.ai/'
            'US Census Address Geocoder|https://us-census-address-geocoder-x402-23mj4x.v2.appdeploy.ai/'
            'Domain RDAP Lookup|https://domain-rdap-lookup-x402-spdfnq.v2.appdeploy.ai/'
            'Treasury Average Interest Rates|https://treasury-average-interest-rates-x402-xeqftl.v2.appdeploy.ai/'
          )
          failed=0
          for item in "${services[@]}"; do
            name="${item%%|*}"
            url="${item#*|}"
            payload=$(jq -nc --arg url "$url" --arg price '0.005' '{kind:"service",url:$url,price:$price,dry_run:true}')
            tmp=$(mktemp)
            status=$(curl -sS -o "$tmp" -w '%{http_code}' https://botmarket.bot/v1/submit               -H 'Content-Type: application/json'               -d "$payload")
            echo "=== $name ==="
            echo "HTTP $status"
            cat "$tmp" | jq . || cat "$tmp"
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then failed=1; fi
            sleep 1
          done
          exit "$failed"
