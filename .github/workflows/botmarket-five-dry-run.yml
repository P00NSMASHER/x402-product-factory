name: BotMarket x402 portfolio submit

on:
  push:
    paths:
      - '.github/workflows/botmarket-five-dry-run.yml'

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit OFAC to BotMarket
        shell: bash
        run: |
          set -u
          url='https://ofac-sdn-name-screen-x402-m9ko96.v2.appdeploy.ai/'
          payload=$(jq -nc --arg url "$url" --arg price '0.005' '{kind:"service",url:$url,price:$price,dry_run:false}')
          tmp=$(mktemp)
          status=$(curl -sS -o "$tmp" -w '%{http_code}' https://botmarket.bot/v1/submit -H 'Content-Type: application/json' -d "$payload")
          echo "HTTP $status"
          cat "$tmp" | jq . || cat "$tmp"
          test "$status" -ge 200 -a "$status" -lt 300
