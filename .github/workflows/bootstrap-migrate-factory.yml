name: Bootstrap factory migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-migrate-factory.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-factory-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone canonical staging source
        run: |
          git clone --depth 1 --branch x402-product-factory-bootstrap \
            https://github.com/P00NSMASHER/permitplate-nyc.git /tmp/factory-source

      - name: Flatten factory subtree into repository root
        shell: bash
        run: |
          set -euo pipefail

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp -a /tmp/factory-source/factory/. .

          mkdir -p .github/workflows
          cp /tmp/factory-source/.github/workflows/factory-pa-vendor-gate-ci.yml \
            .github/workflows/factory-pa-vendor-gate-ci.yml
          cp /tmp/factory-source/.github/workflows/factory-product-003-live-smoke.yml \
            .github/workflows/factory-product-003-live-smoke.yml

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path(".")
          text_suffixes = {".js", ".json", ".md", ".yml", ".yaml", ".txt", ".ts"}

          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text.replace("factory/", "")
              if path.as_posix().startswith(".github/workflows/"):
                  updated = updated.replace("x402-product-factory-bootstrap", "main")
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          manifest_path = Path("MIGRATION_MANIFEST.json")
          manifest = json.loads(manifest_path.read_text())
          manifest["intended_repository"] = "P00NSMASHER/x402-product-factory"
          manifest["copy_roots"] = ["./"]
          manifest["classification_source"] = "product-registry.json"
          manifest["classification_rule"] = manifest.get("classification_rule", "").replace(
              "factory/product-registry.json", "product-registry.json"
          )
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          readme = readme.replace(
              "Migration-ready scaffold for a future dedicated `x402-product-factory` repository.",
              "Canonical repository for the x402 Product Factory."
          )
          readme = re.sub(
              r"## Branch isolation[\s\S]*$",
              "## Repository\n\nThis repository is the canonical home of the factory. "
              "Product code, shared packages, runtime wiring, release gates, and workflows "
              "live at repository root.\n",
              readme,
          )
          readme_path.write_text(readme)
          PY

          rm -f .github/workflows/bootstrap-migrate-factory.yml

      - name: Verify flattened layout
        shell: bash
        run: |
          set -euo pipefail
          test -f product-registry.json
          test -d products
          test -d packages
          test -d runtime
          test -d scripts
          test ! -d factory
          test -f .github/workflows/factory-pa-vendor-gate-ci.yml
          test -f .github/workflows/factory-product-003-live-smoke.yml

          if grep -R --line-number \
            --include='*.js' --include='*.ts' --include='*.json' \
            --include='*.yml' --include='*.yaml' \
            'factory/' . --exclude-dir=.git; then
            echo 'Found stale nested factory/ paths after flattening.'
            exit 1
          fi

      - name: Regenerate root-layout module registry
        run: |
          node scripts/generate-product-module-registry.js
          node scripts/generate-product-module-registry.js --check

      - name: Validate migrated factory
        run: |
          node scripts/validate-js-syntax.js
          node scripts/run-all-tests.js
          node scripts/validate-registry.js
          node scripts/validate-migration-manifest.js
          node scripts/validate-discovery.js
          node scripts/run-release-gates.js

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate x402 Product Factory to repository root'
          git push origin HEAD:main
