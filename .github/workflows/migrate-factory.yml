name: One-time factory migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-factory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy tested factory from permitplate staging branch
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --branch x402-product-factory-bootstrap             https://github.com/P00NSMASHER/permitplate-nyc.git /tmp/factory-source

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          mkdir -p .github/workflows
          find .github/workflows -type f ! -name 'migrate-factory.yml' -delete

          cp -a /tmp/factory-source/factory/. ./

          cp /tmp/factory-source/.github/workflows/factory-pa-vendor-gate-ci.yml             .github/workflows/factory-pa-vendor-gate-ci.yml
          cp /tmp/factory-source/.github/workflows/factory-product-003-live-smoke.yml             .github/workflows/factory-product-003-live-smoke.yml

      - name: Rewrite source-repo paths for dedicated-root layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          root = Path('.')
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.as_posix() == '.github/workflows/migrate-factory.yml':
                  continue
              try:
                  content = path.read_text()
              except UnicodeDecodeError:
                  continue
              if 'factory/' in content:
                  path.write_text(content.replace('factory/', ''))

          for path in [
              Path('.github/workflows/factory-pa-vendor-gate-ci.yml'),
              Path('.github/workflows/factory-product-003-live-smoke.yml'),
          ]:
              content = path.read_text()
              path.write_text(content.replace('x402-product-factory-bootstrap', 'main'))

          for path in Path('scripts').glob('*.js'):
              content = path.read_text()
              content = content.replace(
                  'path.resolve(__dirname,"..","..")',
                  'path.resolve(__dirname,"..")'
              )
              path.write_text(content)

          manifest_path = Path('MIGRATION_MANIFEST.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['copy_roots'] = ['.']
          manifest['classification_source'] = 'product-registry.json'
          manifest['github_workflows'] = [
              '.github/workflows/factory-pa-vendor-gate-ci.yml',
              '.github/workflows/factory-product-003-live-smoke.yml',
          ]
          manifest['migration_source_commit'] = subprocess.check_output(
              ['git','-C','/tmp/factory-source','rev-parse','HEAD'],
              text=True
          ).strip()
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Validate flattened repository
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-js-syntax.js
          node scripts/validate-migration-manifest.js
          node scripts/validate-registry.js
          node scripts/validate-discovery.js
          node scripts/validate-no-nested-seller-calls.js
          node scripts/validate-portfolio-coverage.js
          node scripts/run-release-gates.js
          node scripts/run-all-tests.js

      - name: Commit migrated factory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'x402 Factory Migration'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'Migrate x402 product factory to dedicated repository'
          git push origin HEAD:main
