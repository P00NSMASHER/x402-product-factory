name: BotMarket Supabase x402 submit

on:
  push:
    paths:
      - '.github/workflows/botmarket-supabase-cutover.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Submit Supabase seller to BotMarket
        shell: bash
        run: |
          set -u
          url='https://bvjtimsalbzkmulyinpg.supabase.co/functions/v1/x402-data-tools'
          payload=$(jq -nc --arg url "$url" --arg price '0.005' '{kind:"service",url:$url,price:$price,dry_run:false}')
          tmp=$(mktemp)
          status=$(curl -sS -o "$tmp" -w '%{http_code}' https://botmarket.bot/v1/submit -H 'Content-Type: application/json' -d "$payload")
          echo "HTTP $status"
          cat "$tmp" | jq . || cat "$tmp"
          test "$status" -ge 200 -a "$status" -lt 300
