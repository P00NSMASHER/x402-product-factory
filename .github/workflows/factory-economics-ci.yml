name: Factory economics verification

on:
  pull_request:
    paths:
      - 'economics/**'
      - 'docs/ECONOMICS_*.md'
      - 'docs/SUPABASE_USAGE_EVIDENCE_*.md'
      - 'product-registry.json'
      - 'README.md'
      - '.github/workflows/factory-economics-ci.yml'
  push:
    branches: [main]
    paths:
      - 'economics/**'
      - 'docs/ECONOMICS_*.md'
      - 'docs/SUPABASE_USAGE_EVIDENCE_*.md'
      - 'product-registry.json'
      - 'README.md'
      - '.github/workflows/factory-economics-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-economics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify historical five-product economics and live-rate screening
        run: |
          node --test economics/phase1-five-product-costs.test.js economics/live-fee-economics.test.js economics/supabase-usage-readiness.test.js
      - name: Reproduce saved snapshot fee-only economics without network calls
        run: node economics/live-fee-economics.js --check
